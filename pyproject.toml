[tool.mypy]
python_version = "3.10"
plugins = [
    "mypy_django_plugin.main"
]
exclude = [
    "venv/",
    "migrations/",
    "fixtures/",
    "screenshots/"
]

[tool.mypy.plugins.django-stubs]
django_settings_module = "config.settings"

[tool.flake8]
max-line-length = 120
exclude = [
    "venv",
    "env",
    ".env",
    ".venv",
    "__pycache__",
    ".git",
    ".idea",
    "migrations"
]